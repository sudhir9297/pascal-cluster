<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landscape pond preview</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#253a32}canvas{display:block}aside{max-height:calc(100vh - 48px);overflow:auto;position:fixed;top:24px;left:24px;width:280px;padding:24px;background:#f8faf4ee;border:1px solid #fff;border-radius:16px;box-shadow:0 12px 40px #233a2520}h1{font-size:24px;margin:4px 0 10px}p{font-size:12px;line-height:1.6;color:#64736a}label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0;font-size:12px}select{padding:7px;border:1px solid #bdc9bc;border-radius:5px;background:white}input[type=range]{width:115px;accent-color:#328e92}small{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#328e92}</style><aside><small>Pascal · Landscape</small><h1>Garden pond</h1><p id="info"></p><label>Outline<select id="shape"><option value="oval">Oval</option><option value="circle">Circle</option><option value="rectangle">Rectangle</option><option value="organic">Organic</option></select></label><label>Width<input id="width" type="range" min="1" max="10" step=".1" value="6"></label><label>Length<input id="depth" type="range" min="1" max="8" step=".1" value="4"></label><label>Basin depth<input id="basinDepth" type="range" min=".15" max="3" step=".05" value=".8"></label><label>Bank width<input id="bankWidth" type="range" min=".1" max="1.5" step=".05" value=".35"></label><label>Bank finish<select id="bank"><option value="stone">Stone</option><option value="gravel">Gravel</option></select></label><label>Rock border<select id="rockBorder"><option value="clusters">Scattered clusters</option><option value="continuous" selected>Continuous</option><option value="none">None</option></select></label><label>Border placement<select id="rockBorderPlacement"><option value="shoreline">Water edge</option><option value="outer">Outer bank</option><option value="both" selected>Both sides</option></select></label><label>Rock size<input id="rockBorderSize" type="range" min=".15" max="1.5" step=".05" value=".4"></label><label>Water colour<input id="waterColor" type="color" value="#328e92"></label><label>Ripples<input id="rippleStrength" type="range" min="0" max="1" step=".05" value=".35"></label><label>Animate water<input id="animated" type="checkbox" checked></label><label>Make waves<input id="makeWaves" type="checkbox"></label><p>Drag to orbit · scroll to zoom.<br>Enable Make waves to stir the pond.<br>Uses the plugin’s pond and ground geometry.</p></aside><script type="module" src="preview.js"></script></html>
